<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシート管理 & 出費ダッシュボード</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .drop-zone {
      border: 2px dashed #00d1b2;
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      background-color: #f9fbfb;
      transition: background-color 0.2s;
    }
    .drop-zone:hover { background-color: #f0fdfa; }
    #cameraVideo {
      width: 100%;
      border-radius: 8px;
      background-color: #000;
    }
  </style>
</head>
<body class="has-background-light" style="min-height: 100vh;">

  <nav class="navbar is-primary">
    <div class="navbar-brand">
      <span class="navbar-item is-size-4 has-text-weight-bold">🧾 レシート管理アプリ</span>
    </div>
  </nav>

  <div class="container py-5 px-3">
    <div class="columns">
      
      <!-- 左側: アップロード / カメラ撮影 & 解析結果 -->
      <div class="column is-5">
        <div class="box">
          <h2 class="title is-5">📷 レシートの追加</h2>
          
          <div id="dropZone" class="drop-zone mb-3">
            <p class="has-text-grey">ここに画像をドラッグ＆ドロップ<br>またはクリックして選択</p>
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
          </div>

          <div class="field is-grouped mb-3">
            <div class="control is-expanded">
              <button id="openCameraBtn" class="button is-info is-outlined is-fullwidth">
                📷 その場でカメラ撮影
              </button>
            </div>
          </div>
          
          <button id="uploadBtn" class="button is-primary is-fullwidth" disabled>画像を解析して保存</button>
          
          <div id="loading" class="has-text-centered my-3" style="display: none;">
            <p class="has-text-info">Geminiが解析中...</p>
          </div>
        </div>

        <div id="resultBox" class="box" style="display: none;">
          <h3 class="title is-6">直前の解析結果</h3>
          <p><strong>店舗名:</strong> <span id="resStore">-</span></p>
          <p><strong>合計:</strong> <span id="resTotal" class="has-text-danger is-size-5">0</span> 円</p>
          <hr>
          <table class="table is-fullwidth is-striped is-narrow">
            <thead>
              <tr><th>品目</th><th>価格</th><th>カテゴリ</th></tr>
            </thead>
            <tbody id="resItems"></tbody>
          </table>
        </div>
      </div>

      <!-- 右側: 集計グラフ & 内訳詳細 & 履歴 -->
      <div class="column is-7">
        <div class="box mb-5">
          <div class="is-flex is-justify-content-space-between is-align-items-center mb-3">
            <h2 class="title is-5 mb-0">📊 出費集計</h2>
            
            <!-- 期間フィルター -->
            <div class="field is-grouped mb-0">
              <div class="control">
                <div class="select is-small">
                  <select id="periodTypeSelect" onchange="onPeriodTypeChange()">
                    <option value="all">全期間</option>
                    <option value="year">年で指定</option>
                    <option value="month">月で指定</option>
                    <option value="week">週で指定（日付選択）</option>
                  </select>
                </div>
              </div>
              
              <!-- ドロップダウン用コンテナ -->
              <div class="control" id="detailValueControl" style="display: none;">
                <div class="select is-small">
                  <select id="detailValueSelect" onchange="loadAnalytics()"></select>
                </div>
              </div>

              <!-- カレンダー用コンテナ（週指定用） -->
              <div class="control" id="datePickerControl" style="display: none;">
                <input class="input is-small" type="date" id="weekDatePicker" onchange="loadAnalytics()">
              </div>
            </div>
          </div>

          <!-- 選択期間の合計金額表示 -->
          <div class="notification is-primary is-light py-2 px-4 mb-3">
            <p class="is-size-6">
              選択期間の合計金額: <strong class="is-size-4 has-text-danger" id="periodTotalAmount">0</strong> 円
            </p>
          </div>

          <!-- グラフ -->
          <canvas id="categoryChart" style="max-height: 200px;"></canvas>

          <!-- カテゴリごとの詳細テーブル -->
          <hr class="my-3">
          <h3 class="title is-6 mb-2">カテゴリ別内訳一覧</h3>
          <table class="table is-fullwidth is-striped is-narrow">
            <thead>
              <tr>
                <th>カテゴリ</th>
                <th class="has-text-right">金額</th>
                <th class="has-text-right">割合</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody"></tbody>
          </table>
        </div>

        <div class="box">
          <h2 class="title is-5">📜 最近のレシート履歴</h2>
          <div style="max-height: 250px; overflow-y: auto;">
            <table class="table is-fullwidth is-hoverable">
              <thead>
                <tr><th>日時</th><th>店舗名</th><th>合計金額</th><th>操作</th></tr>
              </thead>
              <tbody id="historyTable"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- カメラ撮影用モーダルポップアップ -->
  <div id="cameraModal" class="modal">
    <div class="modal-background" onclick="closeCameraModal()"></div>
    <div class="modal-card">
      <header class="modal-card-head">
        <p class="modal-card-title">📷 レシート撮影</p>
        <button class="delete" aria-label="close" onclick="closeCameraModal()"></button>
      </header>
      <section class="modal-card-body">
        <video id="cameraVideo" autoplay playsinline></video>
        <canvas id="cameraCanvas" style="display: none;"></canvas>
      </section>
      <footer class="modal-card-foot is-justify-content-space-between">
        <button class="button" onclick="closeCameraModal()">キャンセル</button>
        <button class="button is-success" onclick="takeSnapshot()">📸 パシャ（撮影）</button>
      </footer>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const uploadBtn = document.getElementById('uploadBtn');
    let selectedFile = null;
    let chartInstance = null;
    let cameraStream = null;

    let availableYears = [];
    let availableMonths = [];

    // 初期値として今日の日付を設定 (YYYY-MM-DD)
    document.getElementById('weekDatePicker').value = new Date().toISOString().split('T')[0];

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) return alert('画像ファイルを選択してください');
      selectedFile = file;
      dropZone.querySelector('p').innerHTML = `選択中: <strong>${file.name}</strong>`;
      uploadBtn.disabled = false;
    }

    // --- カメラ起動関連処理 ---
    const cameraModal = document.getElementById('cameraModal');
    const cameraVideo = document.getElementById('cameraVideo');
    const cameraCanvas = document.getElementById('cameraCanvas');

    document.getElementById('openCameraBtn').addEventListener('click', async () => {
      try {
        // スマホなどの背面カメラを優先起動（無ければインカメラ/Webカメラ）
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        cameraVideo.srcObject = cameraStream;
        cameraModal.classList.add('is-active');
      } catch (err) {
        alert('カメラの起動に失敗しました。アクセスを許可してください。\n' + err.message);
      }
    });

    function closeCameraModal() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      cameraModal.classList.remove('is-active');
    }

    function takeSnapshot() {
      const context = cameraCanvas.getContext('2d');
      cameraCanvas.width = cameraVideo.videoWidth;
      cameraCanvas.height = cameraVideo.videoHeight;
      context.drawImage(cameraVideo, 0, 0, cameraCanvas.width, cameraCanvas.height);

      // Canvas から Blob (Fileオブジェクト化) を作成
      cameraCanvas.toBlob((blob) => {
        const file = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });
        handleFile(file);
        closeCameraModal();
      }, 'image/jpeg', 0.9);
    }

    // --- 解析 & 送信処理 ---
    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      const formData = new FormData();
      formData.append('file', selectedFile);

      document.getElementById('loading').style.display = 'block';
      uploadBtn.disabled = true;

      try {
        const res = await fetch('/analyze-receipt', { method: 'POST', body: formData });
        const json = await res.json();

        if (json.status === 'success') {
          showResult(json.data);
          loadAnalytics();
          loadHistory();
        } else {
          alert('解析に失敗しました');
        }
      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
        uploadBtn.disabled = false;
      }
    });

    function showResult(data) {
      document.getElementById('resStore').textContent = data.store_name;
      document.getElementById('resTotal').textContent = data.total.toLocaleString();
      const tbody = document.getElementById('resItems');
      tbody.innerHTML = '';
      data.items.forEach(item => {
        tbody.innerHTML += `<tr><td>${item.name}</td><td>${item.price.toLocaleString()}円</td><td><span class="tag is-info is-light">${item.category}</span></td></tr>`;
      });
      document.getElementById('resultBox').style.display = 'block';
    }

    // 期間指定タイプ切替
    function onPeriodTypeChange() {
      const type = document.getElementById('periodTypeSelect').value;
      const detailControl = document.getElementById('detailValueControl');
      const datePickerControl = document.getElementById('datePickerControl');
      const detailSelect = document.getElementById('detailValueSelect');

      detailSelect.innerHTML = '';
      detailControl.style.display = 'none';
      datePickerControl.style.display = 'none';

      if (type === 'year') {
        detailControl.style.display = 'inline-block';
        availableYears.forEach(y => {
          detailSelect.innerHTML += `<option value="${y}">${y}年</option>`;
        });
      } else if (type === 'month') {
        detailControl.style.display = 'inline-block';
        availableMonths.forEach(m => {
          const [y, month] = m.split('-');
          detailSelect.innerHTML += `<option value="${m}">${y}年${parseInt(month)}月</option>`;
        });
      } else if (type === 'week') {
        datePickerControl.style.display = 'inline-block';
      }
      loadAnalytics();
    }

    // 集計データの読み込み＆グラフ描画
    async function loadAnalytics() {
      const type = document.getElementById('periodTypeSelect').value;
      let value = '';

      if (type === 'year' || type === 'month') {
        value = document.getElementById('detailValueSelect').value || '';
      } else if (type === 'week') {
        value = document.getElementById('weekDatePicker').value || '';
      }

      const res = await fetch(`/analytics?period_type=${type}&value=${value}`);
      const data = await res.json();

      availableYears = data.available_years || [];
      availableMonths = data.available_months || [];

      // 1. 合計金額の計算
      const totalSum = data.by_category.reduce((sum, item) => sum + item.total, 0);
      document.getElementById('periodTotalAmount').textContent = totalSum.toLocaleString();

      // 2. カテゴリ別内訳表の更新
      const tableBody = document.getElementById('categoryTableBody');
      tableBody.innerHTML = '';

      if (data.by_category.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="3" class="has-text-centered has-text-grey">この期間のデータはありません</td></tr>';
      } else {
        data.by_category.forEach(c => {
          const percentage = totalSum > 0 ? ((c.total / totalSum) * 100).toFixed(1) : 0;
          tableBody.innerHTML += `
            <tr>
              <td><strong>${c.category}</strong></td>
              <td class="has-text-right">${c.total.toLocaleString()} 円</td>
              <td class="has-text-right has-text-grey">${percentage} %</td>
            </tr>
          `;
        });
      }

      // 3. 円グラフの更新
      const labels = data.by_category.map(c => c.category);
      const totals = data.by_category.map(c => c.total);

      const ctx = document.getElementById('categoryChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: totals,
            backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#4bc0c0', '#9966ff']
          }]
        }
      });
    }

    // 履歴取得 ＆ 削除機能
    async function loadHistory() {
      const res = await fetch('/receipts');
      const data = await res.json();
      const tbody = document.getElementById('historyTable');
      tbody.innerHTML = '';

      data.receipts.forEach(r => {
        tbody.innerHTML += `
          <tr>
            <td>${r.created_at.split(' ')[0]}</td>
            <td>${r.store_name || '不明'}</td>
            <td>${r.total.toLocaleString()}円</td>
            <td>
              <button class="button is-danger is-small is-outlined" onclick="deleteReceipt(${r.id})">削除</button>
            </td>
          </tr>
        `;
      });
    }

    async function deleteReceipt(id) {
      if (!confirm('このレシートデータを削除してもよろしいですか？')) return;

      const res = await fetch(`/receipts/${id}`, { method: 'DELETE' });
      const json = await res.json();

      if (json.status === 'success') {
        loadAnalytics();
        loadHistory();
      } else {
        alert('削除に失敗しました');
      }
    }

    loadAnalytics();
    loadHistory();
  </script>
</body>
</html>
